<div class="flex items-start gap-3 rounded-xl px-4 py-3 text-sm" role="alert" [class]="style()">
  <svg
    aria-hidden="true"
    class="mt-px size-5 shrink-0"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  >
    <circle cx="12" cy="12" r="9" />
    @if (tone() === 'danger') {
      <path d="M12 7.5v5.5M12 16.5h.01" />
    } @else {
      <path d="M12 11v5.5M12 7.5h.01" />
    }
  </svg>
  <div class="grow font-medium"><ng-content /></div>
</div>
