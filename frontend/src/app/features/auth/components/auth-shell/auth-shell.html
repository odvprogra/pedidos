<div
  class="mx-auto grid max-w-6xl lg:min-h-[calc(100dvh-4rem)] lg:grid-cols-2 lg:items-center lg:gap-12 lg:px-6 lg:py-10"
>
  <aside
    class="relative overflow-hidden bg-brand px-6 pt-6 pb-20 text-white lg:flex lg:h-full lg:min-h-[34rem] lg:flex-col lg:justify-between lg:rounded-[2rem] lg:p-12"
  >
    <div
      aria-hidden="true"
      class="pointer-events-none absolute -top-20 -right-20 size-64 rounded-full bg-white/10"
    ></div>
    <div
      aria-hidden="true"
      class="pointer-events-none absolute -bottom-28 -left-16 hidden size-80 rounded-full bg-accent/25 lg:block"
    ></div>

    <div class="relative">
      <p
        class="hidden rounded-full bg-white/15 px-3 py-1 text-xs font-bold tracking-widest uppercase lg:inline-block"
      >
        Comida de tu ciudad
      </p>
      <p
        class="max-w-md text-2xl leading-tight font-extrabold tracking-tight lg:mt-6 lg:text-5xl lg:leading-[1.1]"
      >
        Tu comida favorita, a unos pocos <span class="text-accent">clics</span>.
      </p>
      <p class="mt-5 hidden max-w-sm text-lg lg:block">
        Descubre los restaurantes cerca de ti, arma tu pedido y síguelo hasta que esté listo.
      </p>
    </div>

    <ul class="relative mt-12 hidden gap-4 lg:grid">
      @for (benefit of benefits; track benefit) {
        <li class="flex items-center gap-3 font-semibold">
          <span class="grid size-8 shrink-0 place-items-center rounded-full bg-white text-brand">
            <svg
              aria-hidden="true"
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
          </span>
          {{ benefit }}
        </li>
      }
    </ul>
  </aside>

  <div class="relative -mt-14 px-4 pb-12 lg:mt-0 lg:px-0 lg:pb-0">
    <div
      class="mx-auto w-full max-w-md rounded-3xl bg-surface p-6 shadow-xl ring-1 shadow-ink/5 ring-line sm:p-8"
    >
      <ng-content />
    </div>
  </div>
</div>
