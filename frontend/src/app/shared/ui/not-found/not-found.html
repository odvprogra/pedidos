<div
  class="grid justify-items-center gap-3 rounded-2xl border border-line bg-surface px-6 py-12 text-center shadow-sm"
>
  <span class="grid size-12 place-items-center rounded-full bg-brand-soft text-brand">
    <svg
      aria-hidden="true"
      class="size-6"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.25"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
  </span>
  <h1 #title tabindex="-1" class="text-2xl font-extrabold outline-none">{{ heading() }}</h1>
  <p class="max-w-md text-muted">{{ message() }}</p>
  <ng-content />
</div>
