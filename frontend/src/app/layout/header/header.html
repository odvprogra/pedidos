<header class="sticky top-0 z-10 bg-brand text-white shadow-md">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4">
    <a routerLink="/" class="text-2xl font-extrabold tracking-tight">
      Pedidos<span class="text-accent">.</span>
    </a>

    @if (account()) {
      <div class="flex items-center gap-3">
        <span
          aria-hidden="true"
          class="grid size-9 shrink-0 place-items-center rounded-full bg-accent font-extrabold text-ink"
        >
          {{ initial() }}
        </span>
        <p class="sr-only leading-tight sm:not-sr-only">
          <span class="block font-bold">{{ firstName() }}</span>
          <span class="block text-xs font-medium">{{ roleLabel() }}</span>
        </p>
        <button
          type="button"
          class="flex items-center gap-2 rounded-full border border-white/40 px-3 py-2 text-sm font-bold transition hover:bg-white/10 focus-visible:ring-4 focus-visible:ring-white/40 focus-visible:outline-none disabled:cursor-wait disabled:opacity-70 sm:ml-2"
          [disabled]="loggingOut()"
          (click)="logOut()"
        >
          <svg
            aria-hidden="true"
            class="size-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          <span class="sr-only sm:not-sr-only">
            {{ loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
          </span>
        </button>
      </div>
    } @else if (status() === 'anonymous') {
      <nav aria-label="Cuenta" class="flex items-center gap-1 sm:gap-2">
        <a
          class="rounded-full px-3 py-2 text-sm font-bold transition hover:bg-white/10"
          routerLinkActive="bg-white/15"
          ariaCurrentWhenActive="page"
          [routerLink]="logInPath"
        >
          Ingresar
        </a>
        <a
          class="rounded-full bg-white px-4 py-2 text-sm font-bold text-brand shadow-sm transition hover:bg-brand-soft"
          ariaCurrentWhenActive="page"
          [routerLink]="registerPath"
          routerLinkActive
        >
          Crear cuenta
        </a>
      </nav>
    }
  </div>

  @if (logOutFailed()) {
    <div class="bg-danger-soft">
      <p role="alert" class="mx-auto max-w-6xl px-4 py-2 text-sm font-medium text-danger">
        No pudimos cerrar la sesión. Intenta de nuevo.
      </p>
    </div>
  }
</header>
