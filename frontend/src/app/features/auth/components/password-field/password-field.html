<div class="relative">
  <input
    appTextInput
    class="pr-12"
    [id]="fieldId()"
    [type]="visible() ? 'text' : 'password'"
    [formControl]="control()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-describedby]="messageId()"
    [attr.aria-invalid]="invalid()"
  />
  <button
    type="button"
    class="absolute inset-y-0 right-0 grid w-12 place-items-center rounded-r-xl text-muted transition hover:text-ink focus-visible:text-brand focus-visible:ring-4 focus-visible:ring-brand/15 focus-visible:outline-none"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="visible()"
    [attr.aria-controls]="fieldId()"
    (click)="toggle()"
  >
    <svg
      aria-hidden="true"
      class="size-5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      @if (visible()) {
        <path d="M3 3l18 18" />
        <path
          d="M10.6 5.6a9.6 9.6 0 0 1 1.4-.1c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.6 6.6C3.9 8.3 2.5 12 2.5 12s3.5 6.5 9.5 6.5a9.4 9.4 0 0 0 4.4-1.1"
        />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
      } @else {
        <path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z" />
        <circle cx="12" cy="12" r="3" />
      }
    </svg>
  </button>
</div>
