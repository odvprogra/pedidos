<section
  aria-labelledby="registration-steps-title"
  class="rounded-2xl bg-brand-soft p-4 sm:p-5 lg:p-6"
>
  <h2
    id="registration-steps-title"
    class="text-sm font-extrabold tracking-wide text-brand-strong uppercase"
  >
    Cómo funciona
  </h2>
  <ol class="mt-3 grid grid-cols-3 gap-2 lg:mt-5 lg:grid-cols-1 lg:gap-5">
    @for (step of steps; track step.title; let number = $index) {
      <li
        class="flex flex-col items-center gap-2 text-center lg:flex-row lg:items-start lg:gap-3 lg:text-left"
      >
        <span
          aria-hidden="true"
          class="grid size-8 shrink-0 place-items-center rounded-full bg-brand text-sm font-extrabold text-white"
        >
          {{ number + 1 }}
        </span>
        <span>
          <span class="block text-sm font-bold lg:text-base">
            {{ step.title }}<span class="sr-only">: </span>
          </span>
          <span class="sr-only lg:not-sr-only lg:mt-0.5 lg:block lg:text-sm lg:text-ink/80">
            {{ step.description }}
          </span>
        </span>
      </li>
    }
  </ol>
</section>
