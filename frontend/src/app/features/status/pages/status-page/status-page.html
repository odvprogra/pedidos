<section class="mx-auto max-w-xl px-4 py-12">
  <h1 class="mb-2 text-3xl font-bold">Estado del sistema</h1>
  <p class="mb-8 text-muted">
    Verificación de la conexión entre frontend, backend y base de datos.
  </p>

  <div class="mb-6 grid gap-3">
    <app-service-status name="Frontend" [detail]="'Angular ' + angularVersion" status="ok" />
    <app-service-status name="Backend" [detail]="backendDetail()" [status]="backendStatus()" />
    <app-service-status
      name="Base de datos"
      [detail]="databaseDetail()"
      [status]="databaseStatus()"
    />
  </div>

  <button appButton type="button" [disabled]="loading()" (click)="check()">
    Volver a verificar
  </button>
</section>
