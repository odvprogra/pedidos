<div class="grid gap-3 px-4 py-4 sm:px-6 md:grid-cols-accounts md:items-center md:gap-x-4">
  <div class="flex min-w-0 items-center gap-3">
    <span
      aria-hidden="true"
      class="grid size-10 shrink-0 place-items-center rounded-full text-sm font-extrabold"
      [class]="avatarStyle()"
    >
      {{ initial() }}
    </span>
    <div class="min-w-0">
      <p class="flex min-w-0 items-center gap-2">
        <span class="truncate font-bold" [class.text-muted]="account().suspended">
          {{ account().name }}
        </span>
        @if (isSelf()) {
          <span class="shrink-0 rounded-full bg-accent px-2 py-0.5 text-xs font-extrabold text-ink">
            Tú<span class="sr-only"> (tu cuenta)</span>
          </span>
        }
      </p>
      <p class="text-sm wrap-anywhere text-muted md:truncate">{{ account().email }}</p>
    </div>
  </div>

  <div class="flex items-center justify-between gap-3 md:contents">
    <p class="text-sm font-semibold">{{ roleLabel() }}</p>
    <p>
      @if (account().suspended) {
        <app-badge tone="danger" size="sm" data-status="suspended">Suspendida</app-badge>
      } @else {
        <app-badge tone="success" size="sm" data-status="active">Activa</app-badge>
      }
    </p>
  </div>

  @if (moderation(); as moderation) {
    <app-moderation-control
      [action]="moderation.action"
      [copy]="moderation.copy"
      [panelId]="confirmId()"
      [busy]="busy()"
      [locked]="locked()"
      [(confirming)]="confirming"
      (confirmed)="confirmed.emit($event)"
    />
  } @else {
    <p class="inline-flex min-h-11 items-center gap-1.5 text-sm font-semibold text-muted">
      <svg
        aria-hidden="true"
        class="size-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.25"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="5" y="11" width="14" height="10" rx="2" />
        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
      </svg>
      Protegida
      <span class="sr-only">: las cuentas de administrador no se suspenden</span>
    </p>
  }
</div>
