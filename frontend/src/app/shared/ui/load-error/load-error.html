<div
  class="grid justify-items-center gap-4 rounded-2xl border border-line bg-surface px-6 py-12 text-center shadow-sm"
>
  <span class="grid size-12 place-items-center rounded-full bg-danger-soft text-danger">
    <svg
      aria-hidden="true"
      class="size-6"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.25"
      stroke-linecap="round"
    >
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7.5v5.5M12 16.5h.01" />
    </svg>
  </span>
  @if (retrying()) {
    <div data-reason>
      <ng-container [ngTemplateOutlet]="reason" />
    </div>
  } @else {
    <div role="alert" data-reason>
      <ng-container [ngTemplateOutlet]="reason" />
    </div>
  }
  <button
    #retryButton
    appButton
    type="button"
    [attr.aria-disabled]="retrying()"
    (click)="requestRetry()"
  >
    @if (retrying()) {
      <app-spinner />
      Reintentando…
    } @else {
      Reintentar
    }
  </button>
</div>

<ng-template #reason>
  <h2 class="text-lg font-extrabold">{{ heading() }}</h2>
  <p class="mt-1 max-w-md text-muted">{{ message() }}</p>
</ng-template>
