<div
  class="flex items-start gap-3 rounded-xl px-4 py-3 text-sm"
  [attr.role]="role()"
  [class]="style()"
>
  <svg
    aria-hidden="true"
    class="mt-px size-5 shrink-0"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="12" r="9" />
    @switch (tone()) {
      @case ('danger') {
        <path d="M12 7.5v5.5M12 16.5h.01" />
      }
      @case ('warning') {
        <path d="M12 11v5.5M12 7.5h.01" />
      }
      @case ('success') {
        <path d="m8.5 12.5 2.5 2.5 4.5-5" />
      }
    }
  </svg>
  <div class="grow font-medium" [appAnnounce]="tone() === 'success'"><ng-content /></div>
  @if (dismissible()) {
    <button
      type="button"
      aria-label="Cerrar aviso"
      class="-my-3 -mr-2 grid size-11 shrink-0 place-items-center rounded-lg transition hover:bg-current/10 focus-visible:outline-2 focus-visible:outline-current"
      (click)="dismissed.emit()"
    >
      <svg
        aria-hidden="true"
        class="size-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <path d="M6 6l12 12M18 6 6 18" />
      </svg>
    </button>
  }
</div>
