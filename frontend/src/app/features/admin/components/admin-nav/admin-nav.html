<nav
  aria-label="Secciones del panel"
  class="flex w-full rounded-xl border border-line bg-surface p-1 sm:inline-flex sm:w-auto"
>
  @for (section of sections; track section.path) {
    <a
      class="inline-flex min-h-11 flex-1 items-center justify-center gap-2 rounded-lg px-2 text-sm font-bold text-muted transition hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand aria-[current=page]:bg-brand aria-[current=page]:text-white sm:flex-none sm:px-4"
      routerLinkActive
      ariaCurrentWhenActive="page"
      [routerLink]="section.path"
      [routerLinkActiveOptions]="{ exact: section.exact }"
    >
      <svg
        aria-hidden="true"
        class="hidden size-4 shrink-0 sm:block"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.25"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        @if (section.icon === 'accounts') {
          <circle cx="9" cy="8" r="3.5" />
          <path d="M2.5 20a6.5 6.5 0 0 1 13 0" />
          <path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5a6.5 6.5 0 0 1 3 5.5" />
        } @else if (section.icon === 'orders') {
          <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" />
          <path d="M9 8h6" />
          <path d="M9 12h6" />
        } @else {
          <path d="M3 9l1.5-5h15L21 9" />
          <path d="M3 9a3 3 0 0 0 6 0a3 3 0 0 0 6 0a3 3 0 0 0 6 0" />
          <path d="M5 12v8h14v-8" />
          <path d="M10 20v-5h4v5" />
        }
      </svg>
      {{ section.label }}
    </a>
  }
</nav>
