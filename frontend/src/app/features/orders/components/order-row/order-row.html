<a
  class="group flex items-center gap-3 rounded-2xl border border-line bg-surface p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand motion-reduce:transition-none motion-reduce:hover:translate-y-0 sm:gap-4 sm:p-5"
  [routerLink]="path()"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="detailsId()"
>
  <span
    aria-hidden="true"
    class="grid size-12 shrink-0 place-items-center rounded-xl bg-accent text-xl font-extrabold text-ink"
  >
    {{ initial() }}
  </span>

  <div class="min-w-0 flex-1">
    <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1.5">
      <h2
        class="leading-snug font-extrabold wrap-anywhere transition group-hover:text-brand motion-reduce:transition-none"
      >
        Pedido #{{ order().id }} · {{ order().restaurantName }}
      </h2>
      <app-order-status-badge size="sm" data-status [status]="order().status" />
    </div>
    <div [id]="detailsId()">
      <p class="mt-1 text-sm text-muted">
        <time class="whitespace-nowrap" [attr.datetime]="order().placedAt">{{ placedAt() }}</time>
        <span aria-hidden="true"> · </span>
        <span class="sr-only">, </span>
        <span class="whitespace-nowrap">{{ items() }}</span>
      </p>
      <p class="mt-1 font-extrabold" data-total>
        <span class="sr-only">Total: </span>{{ total() }}
      </p>
    </div>
  </div>

  <svg
    aria-hidden="true"
    class="size-5 shrink-0 text-muted transition group-hover:translate-x-0.5 group-hover:text-brand motion-reduce:transition-none"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m9 6 6 6-6 6" />
  </svg>
</a>
