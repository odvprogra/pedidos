<div
  class="fixed inset-x-0 bottom-0 z-10 border-t border-line bg-surface px-4 py-3 shadow-lg lg:static lg:rounded-2xl lg:border lg:px-5 lg:py-4 lg:shadow-sm"
  data-cart-bar
>
  <p class="mb-2 hidden text-sm font-semibold text-muted lg:block">Tu pedido · total</p>
  <a appButton class="w-full" [routerLink]="cartPath">
    <span class="sr-only">{{ readableLabel() }}</span>
    <span aria-hidden="true" class="flex w-full items-center justify-between gap-3">
      <span class="inline-flex items-center gap-2">
        <span
          class="grid h-7 min-w-7 place-items-center rounded-full bg-accent px-1.5 text-sm text-ink"
          data-units
        >
          {{ units() }}
        </span>
        Ver carrito
      </span>
      <span data-subtotal>{{ subtotalLabel() }}</span>
    </span>
  </a>
</div>
