<article
  class="flex items-start justify-between gap-4 px-4 py-4 sm:px-5"
  [attr.aria-labelledby]="nameId()"
>
  <div class="min-w-0">
    <h3 class="flex flex-wrap items-center gap-x-2 gap-y-1 font-bold">
      <span class="wrap-anywhere" [id]="nameId()" [class.text-muted]="!product().available">
        {{ product().name }}
      </span>
      @if (!product().available) {
        <app-badge size="sm" data-status="sold-out">Agotado</app-badge>
      }
    </h3>
    @if (product().description; as description) {
      <p class="mt-0.5 text-sm wrap-anywhere text-muted">{{ description }}</p>
    }
  </div>
  <p class="shrink-0 font-extrabold whitespace-nowrap" [class.text-muted]="!product().available">
    <span class="sr-only">Precio: </span>{{ price() }}
  </p>
</article>
