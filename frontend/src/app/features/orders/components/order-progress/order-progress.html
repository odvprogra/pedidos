<p class="text-sm font-bold text-muted sm:hidden" aria-hidden="true" data-progress-summary>
  Paso {{ position() }} de {{ steps().length }} · {{ currentLabel() }}
</p>
<ol aria-label="Progreso del pedido" class="mt-2 grid grid-cols-5 gap-1.5 sm:mt-0">
  @for (step of steps(); track step.status) {
    <li class="grid content-start gap-2" [attr.aria-current]="step.current ? 'step' : null">
      <span
        aria-hidden="true"
        class="h-2 rounded-full motion-safe:transition-colors motion-safe:duration-500"
        [class]="step.done || step.current ? 'bg-brand' : 'bg-line'"
      ></span>
      <span
        aria-hidden="true"
        class="hidden text-xs sm:block"
        [class]="step.current ? 'font-extrabold text-ink' : 'font-semibold text-muted'"
        >{{ step.label }}</span
      >
      <span class="sr-only">{{ step.label }}: {{ stateOf(step) }}</span>
    </li>
  }
</ol>
